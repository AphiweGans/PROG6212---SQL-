name: Validate Docs Structure

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "/docs folder found."

      - name: Check SQL script exists
        run: |
          if [ ! -f "docs/database-script.sql" ]; then
            echo "ERROR: docs/database-script.sql is missing."
            exit 1
          fi
          echo "SQL script found."

      - name: Check ERD file exists (png or pdf)
        run: |
          if ! ls docs/erd.* 1> /dev/null 2>&1; then
            echo "ERROR: ERD file (erd.png or erd.pdf) is missing from /docs."
            exit 1
          fi
          echo "ERD file found."

      - name: Check API endpoint plan exists (md or pdf)
        run: |
          if ! ls docs/api-endpoint-plan.* 1> /dev/null 2>&1; then
            echo "ERROR: API endpoint plan (api-endpoint-plan.md or .pdf) is missing from /docs."
            exit 1
          fi
          echo "API endpoint plan found."

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All checks passed
        run: echo "Repository structure is valid for Part 1 submission."
