name: RaceDay CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build and Validate RaceDay
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Project Structure
        run: |
          echo "RaceDay Project"
          echo "===================="
          echo "Checking repository files..."
          find . -maxdepth 3 -type f | sort

      - name: Validate Documentation
        run: |
          echo "Checking documentation files..."

          test -f README.md
          test -f docs/01_Part1_Overview_and_ERD.md
          test -f docs/02_API_Endpoint_Plan.md
          test -f docs/03_RaceDay_Database_Script.sql
          test -f docs/04_Consistency_Docs_README_GitHub.md

          echo "All required documentation files exist."

      - name: Validate SQL Script
        run: |
          echo "Checking RaceDay SQL script..."

          test -f docs/03_RaceDay_Database_Script.sql

          grep -q "CREATE TABLE dbo.Users" docs/03_RaceDay_Database_Script.sql
          grep -q "CREATE TABLE dbo.Events" docs/03_RaceDay_Database_Script.sql
          grep -q "CREATE TABLE dbo.Categories" docs/03_RaceDay_Database_Script.sql
          grep -q "CREATE TABLE dbo.Enrolments" docs/03_RaceDay_Database_Script.sql
          grep -q "CREATE TABLE dbo.Results" docs/03_RaceDay_Database_Script.sql
          grep -q "CREATE TABLE dbo.RefreshTokens" docs/03_RaceDay_Database_Script.sql

          echo "RaceDay SQL structure detected successfully."

      - name: Validate API Documentation
        run: |
          echo "Checking API endpoint documentation..."

          test -f docs/02_API_Endpoint_Plan.md

          grep -q "/api/auth/register" docs/02_API_Endpoint_Plan.md
          grep -q "/api/auth/login" docs/02_API_Endpoint_Plan.md
          grep -q "/api/events" docs/02_API_Endpoint_Plan.md
          grep -q "/api/categories" docs/02_API_Endpoint_Plan.md
          grep -q "/api/enrolments" docs/02_API_Endpoint_Plan.md
          grep -q "/api/results" docs/02_API_Endpoint_Plan.md

          echo "API endpoint documentation validated."

      - name: Validate ERD Documentation
        run: |
          echo "Checking ERD documentation..."

          test -f docs/01_Part1_Overview_and_ERD.md

          grep -q "USERS" docs/01_Part1_Overview_and_ERD.md
          grep -q "EVENTS" docs/01_Part1_Overview_and_ERD.md
          grep -q "CATEGORIES" docs/01_Part1_Overview_and_ERD.md
          grep -q "ENROLMENTS" docs/01_Part1_Overview_and_ERD.md
          grep -q "RESULTS" docs/01_Part1_Overview_and_ERD.md
          grep -q "REFRESHTOKENS" docs/01_Part1_Overview_and_ERD.md

          echo "ERD documentation validated."

      - name: CI Summary
        run: |
          echo "======================================"
          echo "RaceDay CI Validation Successful"
          echo "======================================"
          echo "ERD documentation: PASS"
          echo "API documentation: PASS"
          echo "SQL documentation: PASS"
          echo "Project documentation: PASS"
          echo "======================================"
